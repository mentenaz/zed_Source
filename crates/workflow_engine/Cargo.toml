[package]
name = "workflow_engine"
description = "Forge workflow execution engine: flow.json schema, action registry, level scheduler and executors, process tracker, project scanner."
license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
chrono.workspace = true
datalogic-rs.workspace = true
futures.workspace = true
indexmap.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net", "sync", "time", "rt", "rt-multi-thread"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }