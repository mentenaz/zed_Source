[package]
name = "dotnet_backend"
description = ".NET SDK/runtime detection, project scanning, package reference reading, and `dotnet list package` JSON parsing — no UI, no app-state dependency."
license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/dotnet_backend.rs"
doctest = false

[dependencies]
gpui_util.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry.workspace = true