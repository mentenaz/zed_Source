license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/cargo_manager_panel.rs"
doctest = false

[dependencies]
anyhow.workspace = true
cargo_backend.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
http_client.workspace = true
project.workspace = true
script_runner_panel.workspace = true
workspace.workspace = true
