[package]
name = "cargo_backend"
description = "Rust/Cargo backend — workspace crates and their dependencies from `cargo metadata` and `Cargo.lock`. No UI, no app-state dependency."
license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/cargo_backend.rs"
doctest = false

[dependencies]
gpui_util.workspace = true
log.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry.workspace = true
