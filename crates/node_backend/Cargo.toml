[package]
name = "node_backend"
description = "Node.js/NVM runtime detection, project scanning, and package.json editing — no UI, no app-state dependency."
license = "Apache-2.0"
edition.workspace = true
version = "0.1.0"
publish = false

[lib]
path = "src/node_backend.rs"
doctest = false

[dependencies]
dunce.workspace = true
gpui_util.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry.workspace = true