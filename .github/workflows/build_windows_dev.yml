name: build_windows_dev

# Manual, no-release build: click "Run workflow" (Actions tab) on any
# branch, download the zipped forgedev.exe from the run's Artifacts section once
# it finishes. Does not create a GitHub Release and does not code-sign —
# for local testing of a branch's build only. See script/bundle-windows.ps1
# for the full signed-installer pipeline this intentionally skips.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Cargo package to build
        required: false
        type: string
        default: zed
      isolate:
        description: >-
          Build as a separate app ("ForgeSuperBuild") with its own
          settings/data dir and instance lock, so it doesn't share state with
          or refuse to launch alongside your regular installed Forge.
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows_x86_64:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Isolate this build as a separate app
        if: ${{ inputs.isolate }}
        shell: pwsh
        run: |
          # Changes the settings/data directory (ForgeSuper ->
          # ForgeSuperBuild) and the Windows single-instance mutex, so this
          # build neither reads/writes your regular Forge's settings and
          # workspace database nor refuses to launch because your regular
          # Forge is already running. Values are consumed by
          # crates/app_names/build.rs.
          "FORGE_DIR_SUFFIX=Build" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FORGE_IPC_SUFFIX=-CI" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build (release)
        shell: pwsh
        run: cargo build --release --package ${{ inputs.package }}

      - name: Package build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binName = if ('${{ inputs.package }}' -eq 'zed') { 'forgedev' } else { '${{ inputs.package }}' }
          Copy-Item "target/release/$binName.exe" dist/ -ErrorAction Stop
          # Best-effort: pick up any runtime DLLs cargo's build scripts placed
          # next to the binary (e.g. conpty.dll) so the .exe has a chance of
          # running standalone. The full installer pipeline
          # (script/bundle-windows.ps1) collects these more thoroughly.
          Get-ChildItem "target/release" -Filter *.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "${{ inputs.package }}-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-windows-x86_64
          path: ${{ inputs.package }}-windows-x86_64.zip
          if-no-files-found: error
